[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/tachyon"]

[workspace.package]
version = "1.2.0"
edition = "2024"
# Matches rust-toolchain.toml; the only toolchain CI builds with.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Dailen Gunter"]
repository = "https://github.com/DailenG/tachyon"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
large_futures = "warn"

[workspace.dependencies]
tachyon-doc = { path = "crates/tachyon-doc" }
tachyon-editor = { path = "crates/tachyon-editor" }
tachyon-platform = { path = "crates/tachyon-platform" }
tachyon-md = { path = "crates/tachyon-md" }
tachyon-text = { path = "crates/tachyon-text" }

# GPUI is consumed straight from the Zed monorepo. Bump `rev` deliberately:
# the API is unstable between revisions.
gpui = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea", features = ["font-kit", "wayland", "x11"] }

# Local-time timestamp fallback for sticky-note file names (`tachyon-editor`'s `notes`
# module). Already resolved by GPUI's own dependency graph (logging), so this adds no new
# build cost.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
lexopt = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ropey = "1.6"
unicase = "2.6"
unicode-segmentation = "1.10"
windows-sys = "0.61"
# Same crate version GPUI already resolves to (Cargo.lock); adding it directly, rather than a
# second `windows`/`windows-sys` major version, keeps one COM binding in the dependency tree.
windows = "0.62"

# Test and benchmark only.
proptest = "1"

# Zed's workspace patches that GPUI's dependency graph relies on. A git
# dependency does not inherit the upstream workspace's [patch] table.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }

[profile.dev.package."*"]
# Dependencies (GPUI) run optimized in debug builds; workspace crates stay at
# opt-level 0 for fast incremental rebuilds.
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
