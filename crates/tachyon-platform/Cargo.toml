[package]
name = "tachyon-platform"
description = "OS integration for Tachyon that GPUI does not provide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
raw-window-handle = "0.6"

# Already in the tree through GPUI's portal client; `blocking-api` only adds macro code.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Recovery",
    "Win32_System_Shutdown",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# `ICustomDestinationList` (the Windows jump list) needs COM interfaces and safe smart-pointer
# casts (`Interface::cast`, `PROPVARIANT::from`) that `windows-sys`'s raw vtables do not provide;
# `windows` is the crate GPUI itself already depends on (see the workspace `Cargo.toml` comment),
# so this adds no second COM binding to the dependency tree.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
